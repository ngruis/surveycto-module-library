[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jpalmena-surveycto-module-library"
version = "0.1.0"
description = "Local searchable library of reusable modules from SurveyCTO form definitions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "keyring>=25.2",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pysurveycto>=0.0.15",
  "platformdirs>=4.3",
  "requests>=2.32",
  "streamlit>=1.37",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
browser = ["playwright>=1.46"]
dev = ["pytest>=8.2", "ruff>=0.6"]
release = ["pyinstaller>=6.16"]

[project.scripts]
surveycto-library = "surveycto_module_library.cli:main"
surveycto-library-desktop = "surveycto_module_library.desktop:main"

[tool.uv]
required-version = ">=0.13.7,<0.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
