name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: SurveyCTO-Module-Library-macOS-Apple-Silicon
            package: SurveyCTO-Module-Library-macOS-Apple-Silicon.dmg
          - os: macos-15-intel
            artifact: SurveyCTO-Module-Library-macOS-Intel
            package: SurveyCTO-Module-Library-macOS-Intel.dmg
          - os: windows-latest
            artifact: SurveyCTO-Module-Library-Windows-x64
            package: SurveyCTO-Module-Library-Windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen --extra release
      - run: uv run pyinstaller packaging/surveycto_module_library.spec --noconfirm --clean
      - name: Smoke-test macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export SURVEYCTO_LIBRARY_DATA_DIR="$RUNNER_TEMP/surveycto-smoke-data"
          export SURVEYCTO_LIBRARY_PORT=8765
          export SURVEYCTO_LIBRARY_HEADLESS=true
          "dist/SurveyCTO Module Library.app/Contents/MacOS/SurveyCTO Module Library" >"$RUNNER_TEMP/surveycto-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8765/_stcore/health | grep --quiet ok; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/surveycto-app.log"
          exit 1
      - name: Smoke-test Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SURVEYCTO_LIBRARY_DATA_DIR = "$env:RUNNER_TEMP\surveycto-smoke-data"
          $env:SURVEYCTO_LIBRARY_PORT = '8765'
          $env:SURVEYCTO_LIBRARY_HEADLESS = 'true'
          $process = Start-Process -FilePath 'dist\SurveyCTO Module Library.exe' -PassThru
          try {
            foreach ($attempt in 1..60) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/_stcore/health' -UseBasicParsing
                if ($response.Content.Trim() -eq 'ok') { exit 0 }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            throw 'The packaged application did not start its local website within 60 seconds.'
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/dmg-root
          ditto "dist/SurveyCTO Module Library.app" "dist/dmg-root/SurveyCTO Module Library.app"
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "SurveyCTO Module Library" -srcfolder dist/dmg-root -ov -format UDZO "dist/${{ matrix.package }}"
      - name: Prepare Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item 'dist\SurveyCTO Module Library.exe' 'dist\${{ matrix.package }}'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.package }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/* --generate-notes --verify-tag
